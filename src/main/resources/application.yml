spring:
  application:
    name: worklog-compliance-batch

  datasource:
    url: jdbc:postgresql://localhost:5432/worklog
    username: postgres
    password: postgres

  batch:
    job:
      name: worklogImportJob
      enabled: true
    jdbc:
      initialize-schema: never

logging:
  level:
#    org.springframework.jdbc.datasource.init: DEBUG
    org.springframework.batch: DEBUG
#    org.springframework.jdbc.core: DEBUG

batch:
  chunksize: 500
  skipLimit: 100
  corepool: 32
  maxpool: 32
  queuelimit: 500

worklog:
  expected-hours:
    MONDAY: 9
    TUESDAY: 9
    WEDNESDAY: 9
    THURSDAY: 9
    FRIDAY: 7